{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora REST - Django 6</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Background Animated Gradients -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div class="app-container">
        <!-- Calculadora Principal -->
        <main class="calculator-card">
            <header class="calc-header">
                <div class="calc-logo">
                    <span class="logo-dot"></span>
                    <h1>CALC<span>REST</span></h1>
                </div>
                <div class="calc-badges">
                    <span class="badge badge-django">Django 6.0</span>
                    <button id="toggle-scientific-btn" class="badge badge-toggle" title="Alternar funções científicas">
                        <i data-lucide="binary"></i>
                        <span>Científica</span>
                    </button>
                </div>
            </header>

            <!-- Display -->
            <div class="calc-display-wrapper">
                <div class="calc-display-history" id="display-history"></div>
                <div class="calc-display-main" id="display-main">0</div>
                <div class="calc-display-status" id="display-status">
                    <span id="status-mode" class="status-indicator">Padrão</span>
                    <span id="status-error" class="status-error-msg"></span>
                </div>
            </div>

            <!-- Botões / Grid -->
            <div class="calc-layout-wrapper">
                <!-- Painel Científico Ocultável -->
                <div class="scientific-panel" id="scientific-panel">
                    <button class="btn btn-sci" data-op="sin(" title="Seno">sin</button>
                    <button class="btn btn-sci" data-op="cos(" title="Cosseno">cos</button>
                    <button class="btn btn-sci" data-op="tan(" title="Tangente">tan</button>
                    <button class="btn btn-sci" data-op="log(" title="Logaritmo Natural">ln</button>
                    <button class="btn btn-sci" data-op="log10(" title="Logaritmo Base 10">log</button>
                    <button class="btn btn-sci" data-op="sqrt(" title="Raiz Quadrada">√</button>
                    <button class="btn btn-sci" data-op="^" title="Potência">x<sup>y</sup></button>
                    <button class="btn btn-sci" data-val="pi" title="Constante PI">π</button>
                    <button class="btn btn-sci" data-val="e" title="Constante Euler">e</button>
                    <button class="btn btn-sci" data-op="exp(" title="Exponencial">exp</button>
                </div>

                <!-- Teclado Numérico e Operadores Comuns -->
                <div class="keypad-grid">
                    <!-- Linha 1 -->
                    <button class="btn btn-action" id="btn-clear" title="Limpar Tudo (Esc)">AC</button>
                    <button class="btn btn-action" id="btn-backspace" title="Apagar Último (Backspace)">
                        <i data-lucide="delete"></i>
                    </button>
                    <button class="btn btn-action" data-op="(" title="Abrir Parênteses">(</button>
                    <button class="btn btn-action" data-op=")" title="Fechar Parênteses">)</button>

                    <!-- Linha 2 -->
                    <button class="btn btn-num" data-val="7">7</button>
                    <button class="btn btn-num" data-val="8">8</button>
                    <button class="btn btn-num" data-val="9">9</button>
                    <button class="btn btn-operator" data-op="÷" title="Divisão">/</button>

                    <!-- Linha 3 -->
                    <button class="btn btn-num" data-val="4">4</button>
                    <button class="btn btn-num" data-val="5">5</button>
                    <button class="btn btn-num" data-val="6">6</button>
                    <button class="btn btn-operator" data-op="×" title="Multiplicação">*</button>

                    <!-- Linha 4 -->
                    <button class="btn btn-num" data-val="1">1</button>
                    <button class="btn btn-num" data-val="2">2</button>
                    <button class="btn btn-num" data-val="3">3</button>
                    <button class="btn btn-operator" data-op="-" title="Subtração">-</button>

                    <!-- Linha 5 -->
                    <button class="btn btn-num" data-val="0">0</button>
                    <button class="btn btn-num" data-val=".">.</button>
                    <button class="btn btn-operator" data-op="%" title="Resto da Divisão">%</button>
                    <button class="btn btn-operator" data-op="+" title="Soma">+</button>
                </div>
            </div>

            <!-- Botão de Igual (Separado para destaque premium) -->
            <div class="calc-footer">
                <button class="btn-equals" id="btn-equals" title="Calcular Resultado (Enter)">
                    <span>Calcular</span>
                    <i data-lucide="corner-down-left"></i>
                </button>
            </div>
        </main>

        <!-- Painel de Histórico lateral -->
        <aside class="history-card">
            <header class="history-header">
                <div class="history-title">
                    <i data-lucide="history"></i>
                    <h2>Histórico</h2>
                </div>
                <button id="btn-clear-history" class="btn-icon-clear" title="Limpar Histórico no Banco">
                    <i data-lucide="trash-2"></i>
                </button>
            </header>

            <div class="history-list-wrapper">
                <ul class="history-list" id="history-list">
                    <!-- Carregado via REST API -->
                    <li class="history-empty">
                        <i data-lucide="inbox"></i>
                        <p>Nenhum cálculo recente</p>
                    </li>
                </ul>
            </div>
            
            <div class="history-footer">
                <p>Clique em um cálculo para recuperá-lo</p>
            </div>
        </aside>
    </div>

    <!-- Script de Lógica do Cliente -->
    <script src="{% static 'js/calculator.js' %}"></script>
    <script>
        // Inicializa ícones do Lucide
        lucide.createIcons();
    </script>
</body>
</html>
